// CycloneDX SBOM from the root project. hl7Core is skipped: its KMP variant matrix
// defeats the plugin's dependency walking. composeApp depends on it as a project
// dependency, so its transitive libraries still land in the SBOM.
initscript {
    def v = System.getenv('CYCLONEDX_VERSION') ?: '1.10.0'
    repositories { gradlePluginPortal(); mavenCentral() }
    dependencies { classpath "org.cyclonedx:cyclonedx-gradle-plugin:$v" }
}

rootProject { p ->
    p.apply plugin: org.cyclonedx.gradle.CycloneDxPlugin

    // The plugin refuses to run unless the root project has a group and version.
    // This repo sets neither, so fill them in only when missing. Set on `p`
    // explicitly: a bare `group = ...` in an init-script closure can bind to the
    // script instead of the project and silently do nothing.
    if (!p.group?.toString()) p.group = 'org.rite.hl7'
    if (!p.version || p.version.toString() == 'unspecified') p.version = '1.0'
    println "cyclonedx: root project ${p.group}:${p.name}:${p.version}"

    def bom = p.tasks.getByName('cyclonedxBom')
    bom.includeConfigs = ['releaseRuntimeClasspath']
    bom.skipProjects = ['hl7Core']
    bom.projectType = 'application'
    bom.schemaVersion = '1.5'
    bom.destination = p.file('build/reports/sbom')
    bom.outputName = 'bom'
    bom.outputFormat = 'json'
    bom.includeBomSerialNumber = false
}
