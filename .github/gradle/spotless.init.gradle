// Injects Spotless + ktlint into every project. Usage:
//   ./gradlew -I .github/gradle/spotless.init.gradle spotlessCheck   (or spotlessApply)
initscript {
    def v = System.getenv('SPOTLESS_VERSION') ?: '6.25.0'
    repositories { gradlePluginPortal(); mavenCentral() }
    dependencies { classpath "com.diffplug.spotless:spotless-plugin-gradle:$v" }
}

allprojects {
    apply plugin: com.diffplug.gradle.spotless.SpotlessPlugin
    spotless {
        kotlin {
            target 'src/**/*.kt'
            targetExclude '**/build/**', '**/generated/**'
            ktlint(System.getenv('KTLINT_VERSION') ?: '1.3.1')
        }
        kotlinGradle {
            target '*.gradle.kts'
            ktlint(System.getenv('KTLINT_VERSION') ?: '1.3.1')
        }
    }
}
