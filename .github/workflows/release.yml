name: Release

# Tag pushes publish the existing tag. Manual branch runs create a release tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl7core-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  release:
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3

      - name: Resolve version and validate release tag
        id: version
        run: |
          VERSION=$(sed -n 's/^hl7core.version=//p' gradle.properties | tr -d '[:space:]')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected hl7core.version=X.Y.Z'; exit 1; }
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "$TAG" ] || { echo "::error::Tag must match hl7core.version ($TAG)."; exit 1; }
          else
            git ls-remote --tags origin "refs/tags/$TAG" > existing-tag.txt
            [ ! -s existing-tag.txt ] || { echo "::error::Tag $TAG already exists; bump hl7core.version."; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build iOS XCFramework and Android publication
        run: ./gradlew :hl7Core:createSwiftPackage :hl7Core:publishAndroidReleasePublicationToMavenLocal --no-daemon --stacktrace

      # createSwiftPackage modifies simulator slices in doLast. Archive the final
      # directory explicitly so the downloaded zip includes the merged slices.
      - name: Archive final XCFramework and update Swift manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          FRAMEWORK=hl7Core/swiftpackage/Hl7Core.xcframework
          lipo -verify_arch arm64 x86_64 "$FRAMEWORK/ios-arm64_x86_64-simulator/Hl7Core.framework/Hl7Core"
          lipo -verify_arch arm64 "$FRAMEWORK/ios-arm64/Hl7Core.framework/Hl7Core"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$FRAMEWORK" "release-assets/Hl7Core-${VERSION}.zip"
          CHECKSUM=$(swift package compute-checksum "release-assets/Hl7Core-${VERSION}.zip")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Hl7Core-${VERSION}.zip"
          awk -v url="$URL" -v checksum="$CHECKSUM" '
            /url: / { sub(/url: ".*"/, "url: \"" url "\"") }
            /checksum: / { sub(/checksum: ".*"/, "checksum: \"" checksum "\"") }
            { print }
          ' Package.swift > Package.swift.tmp
          mv Package.swift.tmp Package.swift
          swift package dump-package > /dev/null
          cp Package.swift release-assets/

      - name: Report Swift manifest status for an existing tag
        if: github.ref_type == 'tag'
        run: |
          if ! git diff --quiet -- Package.swift; then
            echo '::warning::The tagged Swift manifest differs from the built artifact. Use the release ZIP and attached Package.swift; repository-based SwiftPM installation at this tag will not use the updated manifest.'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

      - name: Create release tag containing the Swift manifest
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Package.swift
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare Swift manifest for $TAG"
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish Android to GitHub Packages
        run: ./gradlew :hl7Core:publishAndroidReleasePublicationToGitHubPackagesRepository --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## Hl7Core $TAG

          iOS: Download the XCFramework ZIP and matching Package.swift attached to this release.
          For tag-triggered releases, the generated manifest is an attachment; the existing tag is not modified.
          See docs/consumer/IOS_INTEGRATION.md for Swift integration.

          Android: org.rite.hl7:hl7core:${VERSION}
          See docs/consumer/ANDROID_INTEGRATION.md for GitHub Packages authentication.
          EOF
          gh release create "$TAG" "release-assets/Hl7Core-${VERSION}.zip" \
            release-assets/Package.swift --verify-tag --title "$TAG" --notes-file release-notes.md
