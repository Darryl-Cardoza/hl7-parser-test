name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write      # create GitHub Release + push Package.swift commit
      packages: write      # publish to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^hl7core.version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build iOS xcframework
        run: ./gradlew createSwiftPackage

      - name: Compute xcframework checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum hl7Core/swiftpackage/Hl7Core.xcframework.zip)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Hl7Core.xcframework.zip"
          sed -i '' "s|url: \".*\"|url: \"${URL}\"|" Package.swift
          sed -i '' "s|checksum: \".*\"|checksum: \"${CHECKSUM}\"|" Package.swift

      - name: Publish Android to GitHub Packages
        run: ./gradlew :hl7Core:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Create GitHub Release and upload xcframework
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            hl7Core/swiftpackage/Hl7Core.xcframework.zip \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "## Hl7Core ${{ steps.version.outputs.tag }}

          ### iOS (Swift Package Manager)
          Add in Xcode → File → Add Package Dependencies:
          \`https://github.com/${{ github.repository }}\`

          Also copy \`hl7Core/swiftshim/HL7Interop.swift\` into your app target.

          ### Android (GitHub Packages)
          See \`docs/consumer/ANDROID_INTEGRATION.md\` for full setup.

          \`\`\`kotlin
          implementation(\"org.rite.hl7:hl7core:${VERSION}\")
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated Package.swift
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: update Package.swift for release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
