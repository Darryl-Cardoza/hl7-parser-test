# Layered on top of detekt's default config (buildUponDefaultConfig = true).
style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 140
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongMethod:
    threshold: 120
  LargeClass:
    threshold: 800
  CyclomaticComplexMethod:
    threshold: 25
  TooManyFunctions:
    active: false
