# Layered on top of detekt's default config (buildUponDefaultConfig = true).
# Tuned for a parser/validator library plus a Compose demo app.
style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    maxLineLength: 140
    # KDoc carries literal HL7 sample messages that can't be wrapped.
    excludeCommentStatements: true
    excludes: ['**/commonTest/**', '**/test/**']
  ReturnCount:
    max: 6
    excludeGuardClauses: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # ComposeUIViewController entry point is PascalCase by iOS convention.
    excludes: ['**/iosMain/**/MainViewController.kt']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10
  LongMethod:
    threshold: 150
    excludes: ['**/commonTest/**', '**/test/**']
  LargeClass:
    threshold: 800
    excludes: ['**/commonTest/**', '**/test/**']
  CyclomaticComplexMethod:
    threshold: 35
  ComplexCondition:
    threshold: 6
  TooManyFunctions:
    active: false
